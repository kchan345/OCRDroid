plugins {
    id 'com.android.application'
}

def pins = new groovy.json.JsonSlurper().parse(rootProject.file('runtime.lock.json'))
android {
    namespace 'io.github.ocrdroid'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.github.ocrdroid'
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName '0.2.0-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'MODEL_REVISION', "\"${pins.model_revision}\""
        buildConfigField 'String', 'LLAMA_REVISION', "\"${pins.llama_revision}\""
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DLLAMA_SOURCE_DIR=${rootProject.file('vendor/llama.cpp').absolutePath}",
                    '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'ocr-jni'
            }
        }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    packaging { jniLibs { useLegacyPackaging false } }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'org.commonmark:commonmark:0.30.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.30.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
android.sourceSets.main.assets.srcDir(licenseAssets)
tasks.register('syncRuntimeNotices', Copy) {
    from(rootProject.file('vendor/llama.cpp')) {
        include 'LICENSE', 'vendor/**/LICENSE*'
        include 'vendor/sheredom/subprocess.h'
    }
    into(licenseAssets.map { it.dir('third_party/llama.cpp') })
}
tasks.named('preBuild').configure { dependsOn 'syncRuntimeNotices' }
