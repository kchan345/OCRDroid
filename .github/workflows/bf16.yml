name: Export optional BF16 model folder
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: echo "LLAMA_REV=$(jq -r .llama_revision runtime.lock.json)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_REV }}
          path: vendor/llama.cpp
      - run: |
          pip install -r vendor/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
          python scripts/prepare_models.py --bf16
      - uses: actions/upload-artifact@v4
        with:
          name: ovisocr2-bf16
          path: models/
          compression-level: 0
          retention-days: 14
  android:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse compatible native probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/inference.yml/runs?status=success&per_page=1" > runs.json
          SHA=$(jq -r '.workflow_runs[0].head_sha' runs.json)
          git diff --exit-code "$SHA" HEAD -- native/ocr.cpp native/ocr.h runtime.lock.json
          echo "GATE_RUN=$(jq -r '.workflow_runs[0].id' runs.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ovisocr2-bf16
          path: models
      - uses: actions/download-artifact@v4
        with:
          name: probe-x86_64
          path: build-android
          run-id: ${{ env.GATE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: android-inference-evidence
          path: evidence
          run-id: ${{ env.GATE_RUN }}
          github-token: ${{ github.token }}
      - run: |
          test -f evidence/results/verified.json
          cmp runtime.lock.json evidence/results/runtime.lock.json
          cp -r evidence/fixtures fixtures
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 2
          script: bash scripts/android_probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-android-evidence
          path: results/
